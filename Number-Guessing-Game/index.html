<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game | Home</title>

  <link rel="stylesheet" href="index.css">
</head>
<body>
<header class="header">
  <h1>🎯Number Guessing Game</h1>
  <p>Guess the secret number between 1 and 100</p>
</header>

<main class="hero">
  <section class="hero__container">
    <div class="hero__container--luck">
      <button class="hero__primary--button">🏆 Let's test your luck!</button>
      <p>I have picked a number between</p>
      <p><span class="hero__span--first">1</span> and <span class="hero__span--second"> 100</span></p>
      <div class="hero__container--label">
        <label for="number" class="label-text">Enter your guess</label>
        <input type="number" name="number" id="number" placeholder="Enter a number" class="input__btn">
        <button class="hero__secondary--button">🎉 Check Guess</button>
      </div>
      <p class="hero__hint-text">💡 <span class="hero__hint">Hint:</span> The number is between 1 and 100</p>
    </div>

    <div class="hero__container--flex">
      <div class="hero__container--attempts">
        <p>🎯 Attempts</p>
        <p class="hero__text1">0</p>
        <p class="hero__Attempts-text">keep trying!</p>
      </div>
      <div class="hero__container--Bestscore">
        <p>⭐ Best Score</p>
        <p class="hero__text2">-</p>
        <p class="hero__bestscore-text">Play to set your best</p>
      </div>
      <div class="hero__container--Range">
        <p>📊 Range</p>
        <p class="hero__text3">1 - 100</p>
        <p class="hero__range-text">Easy Mode</p>
      </div>
    </div>

    <div class="hero__game">
      <h4 class="hero__game-text">🕤Game History</h4>
      <hr>
      <p class="hero__noguesses-text">No guesses yet.start the game!</p>
    </div> 
  </section>
</main>
<footer class="footer">
  <button class="footer__btn">🔃 New Game</button>
</footer>
</body>
</html>
