<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game | Home</title>

  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>🎯 Number Guessing Game</h1>
  <p>Guess the secret number between 1 and 100</p>

  <section class="section1">
<div>
  
  <P><button>🏆Let's text your luck!</button></P>
  <p class="p2">I have picked a number between <br>1 and 100</p>
  

 <section class="section2">
  <div>
    <label for="enteryourguess">Enter your guess</label>
    <div>
    <input type="number" name="enteryourguess" id="enteryourguess" placeholder="Enter a number">
    </div>

    <div>
      <button class="b2">🎉Check Guess</button>
    </div>
  </div>
  </section>
    <p>💡 Hints : The number between 1 and 100</p>
 </div>
</section>

<div class="flex-container">
  <section class="box1">
    <p class="p3">🎯Attempt <br>0 <br>keep trying</p>
  </section>

  <section class="box2">
     <p class="p4">⭐ Best Score<br>- <br>Play to set your score</p>
  </section>

  <section class="box3">
     <p class="p5">Range <br>1 - 100 <br>Easy Mode</p>
  </section>
</div>
<section class="section3">
  <p class="p5">Game History</p>
  <p>No guesses yet. Start the game!</p>
</section>

 <div>
  <p class="p6"><button>New game</button></p>
 </div>
</body>
</html>
