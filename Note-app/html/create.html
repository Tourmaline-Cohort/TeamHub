<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script
      src="https://kit.fontawesome.com/b6a94454d7.js"
      crossorigin="anonymous"></script>
    <title>Create Note</title>
    <link rel="stylesheet" href="../css/create.css" />
     <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=exercise"
    />
</head>
<body>
    <header>
        <div class="navbar">
            <a href="./notes.html"><h3 id="nav-close"><i class="fa-solid fa-x"></i></h3></a>
            <h3 id="nav-text">New Note</h3>
          <button type="submit" id="nav-check"><i class="fa-solid fa-check"></i></button> 
        </div>
    </header>

    <div class="titleContainer">
        <h4>Title</h4>
        <input type="text" id="noteTitle" placeholder="Enter title...">
    
    </div>

    <div class="categoryContainer">
        <h4>Category</h4>
        <select id="noteCategory">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="ideas">Ideas</option>
        </select>
    </div>

    <div class="textboxContainer">
        <textarea id="noteContent" placeholder="Enter note content..."></textarea>
    </div>
    <footer>
        <div class="footericons">
            <h4><i class="fa-solid fa-photo-film"></i></h4>
            <h4><i class="fa-regular fa-square-check"></i></h4>
            <h4><i class="fa-solid fa-microphone"></i></h4>
            <h4><i class="fa-solid fa-palette"></i></h4>

        </div>
    </footer>
</body>
</html>
