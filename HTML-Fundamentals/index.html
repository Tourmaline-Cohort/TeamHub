<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game | Home</title>
</head>
    <Header>
        <div>
            <h1>🎯 Number Guessing Game</h1>
            <p>Guess the secret number between 1 and 100</p>
        </div>
    </Header>

    <div>
      <div>
        <button><p>🏆 Let's test your luck!</p></button>
      </div>
      <div>
        <p>I have picked a number between</p>
      </div>

      <div>
        <p>1 and 100</p>
      </div>
      <div>
        <button>
            <p>Enter your guess</p>
            <p># Enter your number </p>
            <p>Check Guess</p>
        </button>
      </div>

      <div>
        <p>💡Hint: The number is between 1 to 100</p>
      </div>
    </div>

    <div>
        <span>
           <div>
            <p>🎯 Attempts</p>
            <p>0</p>
            <p>keep trying</p>
          </div>
       </span>

        <span>
         <div>
            <p>⭐ Best score</p>
            <p>-</p>
            <p>play to set your best</p>
         </div>
        </span>

         <div>
            <p>📊 Range</p>
            <p>1 - 100</p>
            <p>Easy Mode</p>
         </div>
    </div>

    <div>
        <div>
            <p>Game History</p>
        </div>
        <div>
            <p>No guesses yet. Start the game!</p>
        </div>
    </div>

    <div>
        <p><button>🔃 New Game</button></p>
    </div>
</body>
</html>
